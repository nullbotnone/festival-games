<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071013" />
    <meta name="description" content="为华人教会节日聚会设计的互动破冰游戏，简繁英三语：中秋、春节、元宵与全年家宴。" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>欢聚 · Festival Games｜slashai.app</title>
  </head>
  <body>
    <a class="skip-link" href="#game-stage" data-i18n="skip">跳到游戏</a>

    <header class="topbar">
      <a class="brand" href="https://slashai.app/" aria-label="返回 slashai.app 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 2.5c1.15 7.35 3.15 9.95 8.9 13.5-5.75 3.55-7.75 6.15-8.9 13.5-1.15-7.35-3.15-9.95-8.9-13.5 5.75-3.55 7.75-6.15 8.9-13.5Z" /></svg>
        </span>
        <span>slashai<span class="brand-dim">.app</span></span>
      </a>
      <div class="page-title"><span data-i18n="collection">节日游戏</span><i></i><span class="live-label" data-i18n="ready">随时开场</span></div>
      <div class="topbar-tools">
        <div class="seg" role="group" aria-label="语言">
          <button type="button" data-lang="zh" aria-pressed="true">简</button>
          <button type="button" data-lang="tw" aria-pressed="false">繁</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="iconbtn" id="theme-button" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-heading">
        <div>
          <p class="eyebrow"><span></span><span data-i18n="eyebrow">给教会节日聚会的互动游戏</span></p>
          <h1 id="page-heading" data-i18n="title">欢聚，也彼此看见</h1>
        </div>
        <p class="intro-copy" data-i18n="intro">一台电脑投屏就能玩。轻松破冰，也为感谢、祝福与真诚分享留一点空间。</p>
      </section>

      <section class="game-shell" aria-label="节日游戏控制台">
        <aside class="game-library" aria-label="选择游戏">
          <div class="library-head">
            <span class="mono" data-i18n="choose">选择游戏</span>
            <span class="game-count">04</span>
          </div>
          <nav class="game-nav" id="game-nav"></nav>
        </aside>

        <div class="stage" id="game-stage" tabindex="-1">
          <div class="stage-top">
            <div class="stage-identity">
              <span class="festival-chip" id="festival-chip"></span>
              <span class="stage-meta" id="stage-meta"></span>
            </div>
            <div class="stage-tools">
              <button class="tool-button" id="how-button" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M8.4 7.5A1.8 1.8 0 0 1 10.2 6c1.1 0 2 .7 2 1.7 0 1.4-1.5 1.6-1.9 2.7M10.2 13.7h.01"/></svg>
                <span data-i18n="how">玩法</span>
              </button>
              <button class="tool-button" id="fullscreen-button" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4H4v3.5M12.5 4H16v3.5M7.5 16H4v-3.5M12.5 16H16v-3.5"/></svg>
                <span data-i18n="present">投屏</span>
              </button>
            </div>
          </div>
          <div id="game-view" class="game-view"></div>
        </div>
      </section>

      <section class="host-tips" aria-labelledby="tips-heading">
        <div>
          <p class="section-index">01 / HOST NOTES</p>
          <h2 id="tips-heading" data-i18n="tipsTitle">让第一次来的朋友也玩得自在</h2>
        </div>
        <div class="tip-grid">
          <article><span>01</span><h3 data-i18n="tip1Title">从轻松题开始</h3><p data-i18n="tip1Body">先聊食物、家乡和记忆，再进入感谢与信仰。</p></article>
          <article><span>02</span><h3 data-i18n="tip2Title">先听，再回应</h3><p data-i18n="tip2Body">主持人留一点安静，让每个人把话说完整。</p></article>
          <article><span>03</span><h3 data-i18n="tip3Title">分享比得分重要</h3><p data-i18n="tip3Body">竞争只负责热场；有人认真开口时，给他完整的时间。</p></article>
        </div>
      </section>
    </main>

    <footer>
      <a href="https://slashai.app/">slashai.app</a>
      <p data-i18n="footer">为教会而造的开源工具 · 无需登录，不收集参与者资料</p>
      <a href="https://github.com/nullbotnone" target="_blank" rel="noopener">GitHub ↗</a>
    </footer>

    <dialog id="how-dialog" class="how-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <div><span class="mono" id="dialog-kicker"></span><h2 id="dialog-title"></h2></div>
          <button class="close-button" value="close" aria-label="关闭">×</button>
        </div>
        <ol id="dialog-steps"></ol>
        <div class="dialog-note" id="dialog-note"></div>
        <button class="primary-button dialog-action" value="close" data-i18n="gotIt">明白，开始吧</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
