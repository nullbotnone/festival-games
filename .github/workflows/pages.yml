name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages caches every asset for 10 minutes, so a fresh index.html can be
      # paired with a stale app.js -- which is how a new language button ends
      # up wired to a script that has never heard of it. Stamp the commit onto
      # the asset URLs so a deploy can only ever serve one generation.
      - name: Version the asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
